<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="question3.css">
</head>
<body>
<main class="container py-4">
    <h2 class="mb-4 text-center">Products</h2>
    <div class="row">
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card h-100 shadow-sm product-card">
                <img src="image.png" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title">Product Name</h5>
                    <p class="card-text">Rs100</p>
                    <a href="#" class="btn btn-primary">Add to Cart</a>
                </div>
            </div>
        </div>
        <!-- Repeat the above block for more products (3 more for full grid) -->
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
