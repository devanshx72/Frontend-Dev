<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pricing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q8_PricingPlans.css">
</head>
<body>
<main class="container py-4">
    <h2 class="text-center mb-4">Choose Your Plan</h2>
    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="card shadow-lg pricing-card">
                <div class="card-body">
                    <h3>Basic</h3>
                    <h4>Rs10</h4>
                    <ul>
                        <li>Feature 1</li>
                        <li>Feature 2</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card bg-primary text-white shadow-lg pricing-card">
                <div class="card-body">
                    <h3>Pro</h3>
                    <h4>Rs20</h4>
                    <ul>
                        <li>Feature A</li>
                        <li>Feature B</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card shadow-lg pricing-card">
                <div class="card-body">
                    <h3>Premium</h3>
                    <h4>Rs30</h4>
                    <ul>
                        <li>Feature X</li>
                        <li>Feature Y</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
