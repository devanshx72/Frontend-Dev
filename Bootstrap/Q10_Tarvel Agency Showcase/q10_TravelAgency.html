<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <div id="carouselExample" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="2000">
                <img src="Paris.png" class="d-block w-100" alt="Paris">
                <div class="carousel-caption bg-dark bg-opacity-50 rounded">
                    <h5>Paris</h5>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2500">
                <img src="Tokyo.png" class="d-block w-100" alt="Tokyo">
                <div class="carousel-caption bg-dark bg-opacity-50 rounded">
                    <h5>Tokyo</h5>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="Sydney.png" class="d-block w-100" alt="Sydney">
                <div class="carousel-caption bg-dark bg-opacity-50 rounded">
                    <h5>Sydney</h5>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
    <div class="progress mb-3">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
             style="width:70%">70% Booked</div>
    </div>
    <footer class="text-center bg-light py-2">
        Contact: travel@example.com
    </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
