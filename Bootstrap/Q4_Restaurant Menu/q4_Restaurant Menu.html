<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main class="container py-4">
        <h2 class="text-center lead mb-4">Today's Menu</h2>
        <table class="table text-center">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Pasta</td>
                    <td>Main</td>
                    <td>₹250</td>
                </tr>
            </tbody>
        </table>
        <div class="row mb-4">
            <div class="col-md-4">
                <img src="image.png" class="img-fluid" alt="Food">
                <div class="text-center mt-2">Chef Recommendation</div>
            </div>
            <div class="col-md-8">
                <ul class="list-group">
                    <li class="list-group-item active">Chef's Specials</li>
                    <li class="list-group-item">Grilled Paneer</li>
                </ul>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
