<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container text-center p-5">
        <h1 class="fw-bold">Bhavya Tandon</h1>
        <p class="text-dark mb-3">Developer, Designer, Content Creator</p>
        <img src="BHVYA.jpg" class="img-fluid rounded-circle mb-3" alt="Profile">
        <div class="mb-3">
            <a href="#" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-secondary">Download CV</a>
        </div>
        <form>
            <input type="text" class="form-control mb-2" placeholder="Name" required>
            <input type="email" class="form-control mb-2" placeholder="Email" required>
            <textarea class="form-control mb-2" rows="3" placeholder="Message" required></textarea>
            <button class="btn btn-success" type="submit">Send</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
