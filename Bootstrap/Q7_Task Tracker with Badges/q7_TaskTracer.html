<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h2>Tasks <span class="badge bg-primary">3</span></h2>
    <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between align-items-center">
            Assignment <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
            Study <span class="badge bg-warning text-dark">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
            Clean Desk <span class="badge bg-success">Low</span>
        </li>
    </ul>
    <button class="btn btn-success">
        Completed <span class="badge bg-light text-dark">1</span>
    </button>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
