<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <div class="card p-4 mb-4">
        <div class="alert alert-success mb-2">New message received!</div>
        <div class="alert alert-info mb-2">Tip: Update your profile.</div>
        <div class="alert alert-danger mb-2">Warning: Check your tasks!</div>
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            Dismissible alert!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="bg-light border rounded p-3 mt-3">
            Notification summary and quick actions.
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
