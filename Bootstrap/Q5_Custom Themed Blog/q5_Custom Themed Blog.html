<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Homepage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #6d4aff;
            --bs-font-sans-serif: 'Montserrat', Arial, sans-serif;
        }
    </style>
</head>
<body>
<header class="bg-primary text-white py-3 text-center">
    <h1>Techie Blog</h1>
</header>
<main class="container my-4">
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title text-primary">Latest Post</h3>
                    <p class="card-text">Exciting news in tech today!</p>
                    <a href="#" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-primary">
                <div class="card-body">
                    <h3 class="card-title text-primary">Trending Post</h3>
                    <p class="card-text">Check out what’s popular.</p>
                    <a href="#" class="btn btn-primary">Discover</a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="bg-dark text-white text-center py-3">
    <small>© 2025 Techie Blog</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
