<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive CSS Cheat Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="responsive-css-cheat-sheet.css">
</head>
<body>
  <main>
    <section class="cheat-sheet-grid">
      <div class="cheat-box">
        <h2>Filters</h2>
        <p><code>filter: grayscale(100%)</code> applies grayscale effect</p>
      </div>
      <div class="cheat-box">
        <h2>Media Queries</h2>
        <p><code>@media (max-width: 700px)</code> for mobile screens</p>
      </div>
      <div class="cheat-box">
        <h2>Responsive Design</h2>
        <p>Fluid grids, flexible media, and breakpoints</p>
      </div>
      <div class="cheat-box">
        <h2>Typography</h2>
        <p><code>font-size: clamp(1rem, 2vw, 2rem)</code></p>
      </div>
    </section>
  </main>
</body>
</html>
