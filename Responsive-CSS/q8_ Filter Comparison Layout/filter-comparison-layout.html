<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Filter Comparison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <main>
    <section class="comparison-row">
      <figure>
        <img src="image.png" alt="Original Image">
        <figcaption>Before</figcaption>
      </figure>
      <figure>
        <img src="image.png" alt="Filtered Image" class="filter-brightness">
        <figcaption>After</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
