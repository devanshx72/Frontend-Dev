<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Design Principles Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>
  <main>
    <section class="principles-grid">
      <div class="box">
        <h3>Fluid Layouts</h3>
        <p>Uses relative units for width.
          <br>
          <code>width: 80%;</code>
        </p>
      </div>
      <div class="box">
        <h3>Flexible Media</h3>
        <p>Images can scale.
          <br>
          <code>img { max-width: 100%; }</code>
        </p>
      </div>
      <div class="box">
        <h3>Breakpoints</h3>
        <p>Media query for screen size.
          <br>
          <code>@media (max-width: 600px)</code>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
