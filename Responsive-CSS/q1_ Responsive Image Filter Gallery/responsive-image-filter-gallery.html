<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header>
    <h1>Image Filter Gallery</h1>
  </header>
  <main>
    <section class="gallery">
      <figure>
        <img src="img1.png" alt="Image 1" class="filter-blur">
        <figcaption>Blur Effect</figcaption>
      </figure>
      <figure>
        <img src="img2.png" alt="Image 2" class="filter-grayscale">
        <figcaption>Grayscale Effect</figcaption>
      </figure>
      <figure>
        <img src="img3.png" alt="Image 3" class="filter-sepia">
        <figcaption>Sepia Effect</figcaption>
      </figure>
      <figure>
        <img src="img4.png" alt="Image 4" class="filter-brightness">
        <figcaption>Brightness Effect</figcaption>
      </figure>
      <figure>
        <img src="img5.png" alt="Image 5" class="filter-contrast">
        <figcaption>Contrast Effect</figcaption>
      </figure>
      <figure>
        <img src="img6.png" alt="Image 6" class="filter-huerotate">
        <figcaption>Hue Rotate Effect</figcaption>
      </figure>
    </section>
  </main>
  <footer>
    <p>Gallery Demo using CSS Filters</p>
  </footer>
</body>
</html>
