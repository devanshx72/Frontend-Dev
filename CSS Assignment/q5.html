<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>

<body>
    <section class="pricing">
        <div class="plan">
            <h2>Basic</h2>
            <ul>
                <li>5GB Storage</li>
                <li>Email Support</li>
            </ul>
            <p class="price">$5/month</p>
            <a href="#">Choose</a>
        </div>
        <div class="plan popular">
            <h2>Standard</h2>
            <ul>
                <li>50GB Storage</li>
                <li>Priority Support</li>
            </ul>
            <p class="price">$15/month</p>
            <a href="#">Choose</a>
        </div>
        <div class="plan">
            <h2>Premium</h2>
            <ul>
                <li>200GB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <p class="price">$30/month</p>
            <a href="#">Choose</a>
        </div>
    </section>
</body>

</html>
