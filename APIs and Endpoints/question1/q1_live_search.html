<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Live Product Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        #searchBox {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        .product {
            border: 1px solid #ccc;
            padding: 12px;
            margin: 10px 0;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .product img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        #loading {
            display: none;
            font-style: italic;
            color: gray;
        }
    </style>
</head>

<body>
    <h2>Live Product Search</h2>

    <input type="text" id="searchBox" placeholder="Search products..." />
    <div id="loading">Searching...</div>

    <div id="results"></div>

    <script src="q1_live_search.js"></script>
</body>
</html>
