<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Status Dashboard</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        table {
            width: 500px;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }
        .active {
            color: green;
            font-weight: bold;
        }
        .inactive {
            color: red;
            font-weight: bold;
        }
        .error {
            margin-top: 15px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Employee Status Dashboard</h2>

    <div id="errorBox" class="error"></div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Toggle</th>
            </tr>
        </thead>
        <tbody id="employeeTable"></tbody>
    </table>

    <script src="q2_employee_status.js"></script>
</body>
</html>
