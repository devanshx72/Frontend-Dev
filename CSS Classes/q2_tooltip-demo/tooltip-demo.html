<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="tooltip-demo.css">
</head>
<body>
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the icons or words below to see tooltips built purely with CSS.</p>
    </header>

    <main class="tooltip-container">
        <div class="tooltip-item">
            <span class="tooltip-text">This is a home icon tooltip</span>
            🏠
        </div>

        <div class="tooltip-item">
            <span class="tooltip-text">This tooltip appears above the info icon</span>
            ℹ️
        </div>

        <div class="tooltip-item">
            <span class="tooltip-text">CSS Tooltips are cool!</span>
            <strong>Hover Me</strong>
        </div>

        <div class="tooltip-item">
            <span class="tooltip-text">Made using position and opacity</span>
            💡
        </div>
    </main>

    <footer>
        <p>&copy; 2025 CSS Tooltip Examples</p>
    </footer>
</body>
</html>
