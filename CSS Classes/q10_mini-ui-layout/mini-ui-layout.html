<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface Layout</title>
    <link rel="stylesheet" href="mini-ui-layout.css">
</head>
<body>
    <header class="header">
        <h1>Mini User Interface Layout</h1>
    </header>

    <main class="main-card">
        <section class="form-section">
            <h2>Contact Form</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Type your message here..." rows="4"></textarea>

                <button type="submit" class="btn">Submit</button>
            </form>
        </section>

        <section class="image-section">
            <img src="https://img.freepik.com/free-vector/blue-circle-with-white-user_78370-4707.jpg" alt="Sample UI Image">
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Mini UI Layout Example</p>
    </footer>
</body>
</html>
