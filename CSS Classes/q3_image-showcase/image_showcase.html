<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="image_showcase.css">
</head>
<body>
  <header>
    <h1>Image Showcase Layout</h1>
    <p>Hover over each image to see the transformation and overlay effects.</p>
  </header>

  <main class="gallery">
    <figure class="image-card">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Mountain View">
      <figcaption>Mountain View</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Forest Path">
      <figcaption>Forest Path</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Ocean Waves">
      <figcaption>Ocean Waves</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade?auto=format&fit=crop&w=800&q=80" alt="City Skyline">
      <figcaption>City Skyline</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Desert Dunes">
      <figcaption>Desert Dunes</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Sunset Beach">
      <figcaption>Sunset Beach</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2025 CSS Image Showcase Example</p>
  </footer>
</body>
</html>
