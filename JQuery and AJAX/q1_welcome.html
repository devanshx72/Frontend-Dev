<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Welcome Greeting</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; background: #f0f8ff; }
    #greeting { font-size: 32px; margin: 20px; color: #333; }
    button { padding: 12px 20px; margin: 10px; font-size: 16px; cursor: pointer; }

  <div id="greeting"></div>

  <button id="toggleBtn">Toggle Message</button>

  <script src="q1_welcome.js"></script>
